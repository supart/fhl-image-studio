name: Windows Portable 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要创建的 Windows Release 标签
        required: true
        default: windows-v2.0.4-release

permissions:
  contents: write

env:
  NODE_VERSION: "24.13.1"
  GO_VERSION: "1.26.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  windows-portable:
    name: 构建 Windows Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go-cli/go.sum
            image-studio/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: image-studio/frontend/package-lock.json
      - name: Validate release identity
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          node .\scripts\sync-version-metadata.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Get-Content -Raw .\product-version.json | ConvertFrom-Json
          if ($env:REQUESTED_TAG -ne [string]$config.windowsTag) {
            throw "Release tag must exactly match $($config.windowsTag)."
          }
          $packageName = "FHL-Image-Studio-Desktop-$($config.displayVersion)-Windows-Portable"
          "PRODUCT_VERSION=$($config.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DISPLAY_VERSION=$($config.displayVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_TAG=$($config.windowsTag)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NOTES_NAME=RELEASE_NOTES_DESKTOP_$($config.displayVersion).md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build portable package
        shell: pwsh
        run: .\scripts\package-windows-portable.ps1 -OutputRoot "$env:RUNNER_TEMP\release-assets"
      - name: Check portable package safety
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "release-assets\$env:PACKAGE_NAME"
          $zip = Join-Path $env:RUNNER_TEMP "release-assets\$env:PACKAGE_NAME.zip"
          .\scripts\check-release-safety.ps1 -ReleaseRoot $root -ZipPath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ runner.temp }}\release-assets\${{ env.PACKAGE_NAME }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WINDOWS_TAG }}
          name: FHL Image Studio Windows 桌面版 ${{ env.DISPLAY_VERSION }} 正式发布
          body_path: ${{ env.RELEASE_NOTES_NAME }}
          files: ${{ runner.temp }}\release-assets\${{ env.PACKAGE_NAME }}.zip
