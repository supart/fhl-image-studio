name: Windows Portable 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要创建或更新的 Windows Release 标签
        required: true
        default: windows-v2.0.3

permissions:
  contents: write

env:
  NODE_VERSION: "24.13.1"
  GO_VERSION: "1.26.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  windows-portable:
    name: 构建 Windows Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go-cli/go.sum
            image-studio/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: image-studio/frontend/package-lock.json
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build portable package
        shell: pwsh
        run: .\scripts\package-windows-portable-v2.0.3.ps1 -OutputRoot "$env:RUNNER_TEMP\release-assets"
      - name: Check portable package safety
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "release-assets\FHL-Image-Studio-Desktop-V2.0.3-Windows-Portable"
          $zip = Join-Path $env:RUNNER_TEMP "release-assets\FHL-Image-Studio-Desktop-V2.0.3-Windows-Portable.zip"
          .\scripts\check-release-safety.ps1 -ReleaseRoot $root -ZipPath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: FHL-Image-Studio-Desktop-V2.0.3-Windows-Portable
          path: ${{ runner.temp }}\release-assets\FHL-Image-Studio-Desktop-V2.0.3-Windows-Portable.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: FHL Image Studio Windows 桌面版 V2.0.3 正式发布
          body_path: RELEASE_NOTES_DESKTOP_V2.0.3.md
          files: ${{ runner.temp }}\release-assets\FHL-Image-Studio-Desktop-V2.0.3-Windows-Portable.zip
